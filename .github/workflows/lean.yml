name: lean
on:
  push:
    paths: ["lean/**", ".github/workflows/lean.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lakefile.toml', 'lean/lean-toolchain') }}
      - name: Fetch Mathlib and its build cache
        run: |
          lake update
          lake exe cache get
      - name: Build
        run: lake build 2>&1 | tee build.log
      - name: Refuse sorry and extra axioms
        run: |
          ! grep -n "sorry" Erdos699Reduction.lean
          printf 'import Erdos699Reduction\n#print axioms Erdos699.reduction\n' > Axioms.lean
          lake env lean Axioms.lean | tee axioms.log
          ! grep -q "sorryAx" axioms.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-build
          path: |
            lean/build.log
            lean/axioms.log
            lean/lake-manifest.json
